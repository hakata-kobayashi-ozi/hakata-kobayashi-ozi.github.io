<style>

}

  --accent:#5fc0b7; --accent-soft:#1f3634; --warn-bg:#3a2f14; --warn:#f0c46a; --demo:#a9adf5; --demo-soft:#25274a; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#141a1a; --card:#1d2525; --fg:#e6ecea; --sub:#9fb0ad; --line:#334140;
  --accent:#5fc0b7; --accent-soft:#1f3634; --warn-bg:#3a2f14; --warn:#f0c46a; --demo:#a9adf5; --demo-soft:#25274a; color-scheme:dark }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.6;

.wrap { max-width:540px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.demo { background:var(--demo-soft); border:1px dashed var(--demo); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--demo); }
.demo .btns { display:flex; gap:6px; margin-top:6px; }
.demo button { flex:1; padding:8px; border-radius:8px; border:1px solid var(--demo); background:transparent; color:var(--demo); font:inherit; cursor:pointer; }
.demo button.on { background:var(--demo); color:var(--card); font-weight:700; }
header { display:flex; flex-direction:column; gap:8px; }
header h1 { font-size:20px; margin:0; text-wrap:balance; }
header .tag { font-size:13px; color:var(--sub); }
.langs { display:flex; gap:6px; flex-wrap:wrap; }
.langs button { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:14px; cursor:pointer; }

.notice { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; }
.notice a { color:inherit; font-weight:700; }
section.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.card h2 { font-size:15px; margin:0; display:flex; gap:8px; align-items:baseline; }
.card h2 .n { color:var(--accent); font-variant-numeric:tabular-nums; }
.menus { display:grid; gap:8px; }
.menu { text-align:left; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
.menu small { display:block; color:var(--sub); font-size:13px; }
.menu .min { color:var(--sub); font-size:13px; white-space:nowrap; }

.day b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
.day:disabled { opacity:.35; cursor:default; }
.times { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; }
.time { padding:10px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; font-variant-numeric:tabular-nums; cursor:pointer; }
.hint { font-size:13px; color:var(--sub); margin:0; }
label.f { display:flex; flex-direction:column; gap:4px; font-size:14px; }
label.f span em { color:var(--accent); font-style:normal; font-size:12px; margin-left:6px; }
input[type=text], input[type=email], input[type=tel], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
textarea { min-height:72px; resize:vertical; }
.radio { display:flex; gap:8px; flex-wrap:wrap; }
.radio label { display:flex; gap:6px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
.chk { display:flex; gap:8px; align-items:flex-start; font-size:14px; }
button.go { width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:var(--card); font:inherit; font-weight:700; font-size:16px; cursor:pointer; }
button.go:disabled { opacity:.4; cursor:default; }
button.back { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }

dl.sum dt { color:var(--sub); } dl.sum dd { margin:0; min-width:0; overflow-wrap:anywhere; }
.done h2 { font-size:18px; color:var(--accent); }
.err { color:#c0392b; font-size:13px; margin:0; }

    <dl class="sum" id="sum"></dl>

    <p class="err" id="sendErr" hidden></p>

  data:null, ins:'', menu:'', date:'', time:'', times:null, timesFor:'' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const parts = k => { const [y,m,d] = k.split('-').map(Number); return { m, d, w: new Date(Date.UTC(y, m-1, d)).getUTCDay() }; };
const wdName = (L, w) => T[L].wd[w];

async function api(action, data) {
  let res, text;
  try {
    res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data || {})) });
    text = await res.text();
  } catch (e) { throw new Error('E_NET'); }
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error('E_BUSY'); }
  if (!j.ok) throw new Error(j.error || 'E_BUSY');
  return j;
}
const msgOf = e => T[S.lang][e.message] || T[S.lang].E_BUSY;

function render() {
  const L = S.lang, t = T[L];
  document.documentElement.lang = L === 'zh' ? 'zh-CN' : L;
  $('langs').innerHTML = '';
  LANGS.forEach(k => { const b = document.createElement('button'); b.textContent = T[k].lang; b.className = k === L ? 'on' : ''; b.onclick = () => { S.lang = k; render(); }; $('langs').appendChild(b); });
  const set = (id, v, html) => { $(id)[html ? 'innerHTML' : 'textContent'] = v; };
  set('t_title', t.title); set('t_tag', t.tag); set('t_line', t.line, true); $('lineA').href = LINE_URL;
  set('t_tr', t.tr); $('t_tr').hidden = !t.tr;
  set('t_s0', t.s0); set('insYes', t.yes); set('insNo', t.no);
  set('t_s1', t.s1); set('t_s2', t.s2); set('t_s3', t.s3); set('t_ins', S.ins === 'no' ? t.insN : t.insY); set('t_range', t.range);
  set('t_name', t.name); set('t_req1', t.req); set('t_mail', t.mail); set('t_req2', t.req); set('t_tel', t.tel);
  set('t_msg', t.msg); set('t_agree', t.agree);
  set('toConfirm', t.next); set('t_conf', t.conf); set('t_confnote', t.confnote); set('send', t.send); set('back', t.back);
  set('t_done', t.done); set('t_donebody', t.donebody); set('t_donenote', t.donenote);
  ['insYes','insNo'].forEach(id => $(id).classList.toggle('on', $(id).dataset.v === S.ins));
  if (!S.data) return;
  // メニュー
  $('menuBox').hidden = !S.ins;
  $('menus').innerHTML = '';
  (S.ins === 'no' ? S.data.visitor : S.data.insured).forEach(m => {
    const b = document.createElement('button'); b.className = 'menu' + (S.menu === m.id ? ' on' : '');
    b.innerHTML = '<span>' + esc(t.menus[m.id][0]) + '<small>' + esc(t.menus[m.id][1]) + '</small></span><span class="min">' + esc(t.min(m.minutes)) + '</span>';
    b.onclick = () => { S.menu = m.id; S.time = ''; S.times = null; render(); if (S.date) loadTimes(); };
    $('menus').appendChild(b);
  });
  // 日にち
  $('dateBox').hidden = !S.menu;
  $('days').innerHTML = '';
  S.data.dates.forEach(k => {
    const p = parts(k), b = document.createElement('button');
    b.className = 'day' + (S.date === k ? ' on' : '');
    b.innerHTML = esc(wdName(L, p.w)) + '<b>' + p.m + '/' + p.d + '</b>';
    b.onclick = () => { S.date = k; S.time = ''; render(); loadTimes(); };
    $('days').appendChild(b);
  });
  // 時間
  $('times').innerHTML = '';
  if (!S.date) $('timeMsg').textContent = t.pick;
  else if (!S.times) $('timeMsg').textContent = t.loading;
  else {
    $('timeMsg').textContent = S.times.length ? '' : t.none;
    S.times.forEach(s => { const b = document.createElement('button'); b.className = 'time' + (S.time === s ? ' on' : ''); b.textContent = s; b.onclick = () => { S.time = s; render(); }; $('times').appendChild(b); });
  }
  $('infoBox').hidden = !S.time;
  if (!$('confirm').hidden) summary('sum');
  if (!$('done').hidden) summary('sum2');
  if (!$('err').hidden) $('err').textContent = t.errFill;
}

async function loadTimes() {
  const key = S.date + '|' + S.menu; S.timesFor = key; S.times = null; render();
  try {
    const r = await api('webSlots', { date: S.date, menu: S.menu });
    if (S.timesFor === key) { S.times = r.times; render(); }
  } catch (e) { if (S.timesFor === key) { S.times = []; render(); $('timeMsg').textContent = msgOf(e); } }
}

function whenText(L) { const p = parts(S.date); return T[L].date(p.m, p.d, wdName(L, p.w)) + ' ' + S.time; }
function summary(id) {
  const L = S.lang, t = T[L];
  const rows = [[t.sMenu, t.menus[S.menu][0]], [t.sDate, whenText(L)], [t.sName, $('name').value.trim()], [t.sMail, $('mail').value.trim()]];
  if ($('tel').value.trim()) rows.push([t.sTel, $('tel').value.trim()]);
  rows.push([t.sIns, S.ins === 'yes' ? t.yes : t.no]);
  if ($('msg').value.trim()) rows.push([t.sMsg, $('msg').value.trim()]);
  $(id).innerHTML = '';
  rows.forEach(([k, v]) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; $(id).append(dt, dd); });
}

[...$('insBtns').children].forEach(b => b.onclick = () => { S.ins = b.dataset.v; S.menu = ''; S.date = ''; S.time = ''; S.times = null; render(); });
$('toConfirm').onclick = () => {
  const ok = S.menu && S.date && S.time && $('name').value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('mail').value.trim()) && $('agree').checked;
  $('err').hidden = !!ok; if (!ok) { $('err').textContent = T[S.lang].errFill; return; }
  $('steps').hidden = true; $('confirm').hidden = false; $('sendErr').hidden = true; summary('sum'); window.scrollTo(0, 0);
};
$('back').onclick = () => { $('confirm').hidden = true; $('steps').hidden = false; };
$('send').onclick = async () => {
  const b = $('send'); b.disabled = true; b.textContent = T[S.lang].sending; $('sendErr').hidden = true;
  try {
    await api('webBook', { lang: S.lang, ins: S.ins, menu: S.menu, date: S.date, time: S.time,
      name: $('name').value.trim(), mail: $('mail').value.trim(), tel: $('tel').value.trim(), msg: $('msg').value.trim(), hp: $('hp').value });
    $('confirm').hidden = true; $('done').hidden = false; summary('sum2'); window.scrollTo(0, 0);
  } catch (e) {
    $('sendErr').textContent = msgOf(e); $('sendErr').hidden = false;
    if (e.message === 'E_TAKEN') { S.time = ''; loadTimes(); $('back').click(); $('timeMsg').textContent = T[S.lang].E_TAKEN; }
  } finally { b.disabled = false; b.textContent = T[S.lang].send; }
};

(async () => {
  render();
  try { S.data = await api('webInit'); $('loading').hidden = true; $('steps').hidden = false; render(); }
  catch (e) { $('loading').hidden = true; $('fatal').textContent = msgOf(e); $('fatal').hidden = false; }
})();
</script>
</body>
</html>
